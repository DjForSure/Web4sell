<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7eee8"><title>SIMPLE SORRY — A Little Love Studio</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:'DM Sans',Arial,sans-serif}button{font:inherit}body{background:#fff8f5;color:#453633}.hero{text-align:center;min-height:100vh;padding:70px 20px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden}.hero:before,.hero:after{content:'';position:absolute;width:260px;height:260px;border:1px solid #eed8d2;border-radius:50%}.hero:before{left:-140px;top:8%}.hero:after{right:-130px;bottom:5%}.hero>*{position:relative}.hero small{font-size:9px;letter-spacing:.22em;color:#b17f77}.flower{font-size:36px;color:#c58d84;margin:28px;animation:spin 18s linear infinite}h1{font:500 clamp(55px,11vw,95px)/.95 Georgia;letter-spacing:-.06em;margin:0}h1 i,h2 i{color:#c18b83;font-weight:400}.hero p{max-width:420px;line-height:1.9;color:#89746e;margin:25px auto}button{border:1px solid #c8958c;background:white;padding:15px 25px;border-radius:40px;color:#75534e;cursor:pointer}button:hover{background:#c8958c;color:white}#answer{min-height:48px;margin-top:16px;color:#ad756e;font:italic 17px Georgia}.scroll{position:absolute;bottom:25px}.ending{text-align:center;padding:110px 20px;background:#f5e7e2}.ending h2{font:50px/1.15 Georgia}.ending p{color:#947d76}.ending p:last-child{font:italic 17px Georgia;margin-top:35px}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><section class="hero"><small>A NOTE JUST FOR YOU</small><div class="flower">✿</div><h1>I'm sorry,<br><i id="recipient">Your Love.</i></h1><p id="message"></p><button id="forgive">Will you forgive me?</button><div id="answer" aria-live="polite"></div><small class="scroll">A LITTLE MORE BELOW ↓</small></section><section class="ending"><span>—</span><p>I know words can't undo everything.</p><h2>But I hope this is<br>a <i>gentle beginning.</i></h2><p id="signature"></p></section><script>const CONFIG={recipientName:'Your Love',senderName:'Someone Special',message:'I may not have said things the right way, and I am truly sorry. You matter to me, and I never wanted to make your heart feel heavy.',photos:[],notes:[]};const $=s=>document.querySelector(s);$('#recipient').textContent=CONFIG.recipientName||'Your Love';$('#message').textContent=CONFIG.message;$('#signature').textContent='With care, '+(CONFIG.senderName||'Someone Special');let n=0;$('#forgive').onclick=()=>{$('#answer').textContent=n++?'Take all the time you need. I will listen. ♡':'Thank you for hearing me. No pressure, just honesty. ♡';$('#forgive').textContent='Sending a little hug ♡'};</script></body></html>
